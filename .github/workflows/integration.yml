name: Dragon de Jade - tests integration
on:
  push:
    branches: [main, integration-v0.8.1, integration-v0.12.0, publication-v0.12.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and integration checks
        run: |
          node tests/integration.cjs
          node tests/vocabulary-art.cjs
          node tests/episodes.cjs
          node tests/runtime.cjs
          node tests/service-worker.cjs
